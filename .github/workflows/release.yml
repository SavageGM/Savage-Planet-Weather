name: Build Foundry Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read module version
        id: module
        shell: bash
        run: |
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=savage-planet-weather-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Validate manifest JSON
        shell: bash
        run: jq empty module.json

      - name: Build module archive
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/savage-planet-weather
          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude '*.zip' \
            ./ dist/savage-planet-weather/
          cd dist
          zip -r "${{ steps.module.outputs.archive }}" savage-planet-weather

      - name: Publish or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.module.outputs.tag }}
          name: Savage Planet Weather ${{ steps.module.outputs.tag }}
          files: dist/${{ steps.module.outputs.archive }}
          generate_release_notes: true
          make_latest: true
